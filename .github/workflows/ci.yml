name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            python3-rosdep \
            libfcl-dev

      - name: Resolve ROS dependencies with rosdep
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Install Python dependencies
        run: |
          pip install --break-system-packages --ignore-installed \
            "roboticstoolbox-python>=1.3.1" \
            "spatialgeometry>=1.3.0" \
            spatialmath-python \
            transforms3d \
            trimesh \
            python-fcl \
            "numpy>=2.0"

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --packages-select kinematic_planner_interfaces robot_3r_description kinematic_planner xarm7_description

      - name: Run tests
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          python3 -m pytest src/kinematic_planner/test -q
